name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate Android Project
        run: flutter create --project-name transit_helper --org com.alfadniah .

      - name: Restore our original code
        run: git checkout -- lib/ pubspec.yaml

      # الخطوة السحرية: إصلاح مشكلة مكتبة قراءة النصوص (ML Kit)
      - name: Fix ML Kit R8 Issue
        run: |
          echo "-dontwarn com.google.mlkit.vision.text.chinese.**" >> android/app/proguard-rules.pro
          echo "-dontwarn com.google.mlkit.vision.text.devanagari.**" >> android/app/proguard-rules.pro
          echo "-dontwarn com.google.mlkit.vision.text.japanese.**" >> android/app/proguard-rules.pro
          echo "-dontwarn com.google.mlkit.vision.text.korean.**" >> android/app/proguard-rules.apk

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: transit-helper-apk
          path: build/app/outputs/flutter-apk/app-release.apk
